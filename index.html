<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" sizes="96x96">
        <title>Device Shop Checkout | devChallenges.io</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body>
        <header>
            <h1>Checkout</h1>
            <span class="item-num">3 ITEMS</span>
        </header>

        <main>
            <div class="cart">
                <!-- Cart -->
                <div class="cart__allItems">
                    <div class="cart__item">
                        <picture class="cart__image-container">
                            <source media="(min-width: 768px)" srcset="assets/Gold@2x.png">
                            <img class="cart__image" src="assets/Gold.png" alt="Phone">
                        </picture>
                        <span class="cart__device grid__top">iPhone 12 Pro</span>
                        <span class="cart__color">Golden</span>
                        <span class="cart__price grid__top">$999.00</span>
                        <span class="cart__number">x 1</span>
                        <span class="cart__icon">
                            <img src="assets/close-icon.svg" alt="close icon">
                        </span>
                    </div>
                    <div class="cart__item">
                        <picture class="cart__image-container">
                            <source media="(min-width: 768px)" srcset="assets/Apple-watch@2x.png">
                            <img class="cart__image cart__image--small" src="assets/Apple-watch.png" alt="Watch">
                        </picture>
                        <span class="cart__device grid__top">Apple Watch</span>
                        <span class="cart__color">Blue</span>
                        <span class="cart__price grid__top">$399.00</span>
                        <span class="cart__number">x 1</span>
                        <span class="cart__icon">
                            <img src="assets/close-icon.svg" alt="close icon">
                        </span>
                    </div>
                    <div class="cart__item">
                        <picture class="cart__image-container">
                            <source media="(min-width: 768px)" srcset="assets/iMac@2x.png">
                            <img class="cart__image" src="assets/iMac.png" alt="Laptop">
                        </picture>
                        <span class="cart__device grid__top">iMac</span>
                        <span class="cart__color">Green</span>
                        <span class="cart__price grid__top">$1199.00</span>
                        <span class="cart__number">x 1</span>
                        <span class="cart__icon">
                            <img src="assets/close-icon.svg" alt="close icon">
                        </span>
                    </div>
                </div>

                <hr>

                <!-- Coupon -->
                <form class="cart__coupon coupon">
                    <input type="text" name="coupon" class="coupon__input" placeholder="Enter coupon code">
                    <button type="button" class="coupon__btn">Apply Coupon</button>
                </form>

                <!-- Price summary -->
                <dl class="cart__summary summary">
                    <div class="summary__item">
                        <dt>Sub total</dt>
                        <dd>$2597.00</dd>
                    </div>

                    <div class="summary__item summary__spacing">
                        <dt>Tax</dt>
                        <dd>$623.28</dd>
                    </div>

                    <div class="summary__item summary__item--total">
                        <dt>Total</dt>
                        <dd>$3220.28</dd>
                    </div>
                </dl>
            </div>

            <section class="form__section">
                <h2 class="form__heading">Contact Information</h2>

                <form class="form">
                    <div class="form__item form__block">
                        <label class="form__label" for="full-name">First & Last name</label>
                        <input class="form__input" type="text" name="full-name" id="full-name" required placeholder="Enter first & last name">
                    </div>
                    <div class="form__item form__block">
                        <label class="form__label" for="email">Email Address</label>
                        <input class="form__input" type="email" name="email" id="email" required placeholder="Enter email address">
                    </div>
                    <div class="form__inline">
                        <div class="form__item">
                            <label class="form__label" for="country">Country</label>
                            <select class="form__input" id="country">
                                <option value="finland" selected>Finland</option>
                                <option value="nigeria">Nigeria</option>
                                <option value="cambodia">Cambodia</option>
                                <option value="new-zealand">New Zealand</option>
                                <option value="ghana">Ghana</option>
                                <option value="japan">Japan</option>
                                <option value="egypt">Egypt</option>
                            </select>
                        </div>
                        <div class="form__item">
                            <label class="form__label" for="postal-code">Postal Code</label>
                            <input class="form__input" type="text" name="postal-code" id="postal-code" required placeholder="00270">
                        </div>
                    </div>
                    <button type="submit" class="form__button">Continue</button>
                </form>
            </section>
        </main>

        <footer></footer>
    </body>
</html>
