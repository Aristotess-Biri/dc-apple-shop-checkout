<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="assets/favicon.ico" type="image/x-icon" sizes="96x96">
        <title>Device Shop Checkout | devChallenges.io</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body>
        <header>
            <h1>Checkout</h1>
            <span class="item-num">3 ITEMS</span>
        </header>

        <main>
            <section class="cart" aria-label="Shopping Cart Items">
                <!-- Cart -->
                <div class__allItems>
                    <div class="cart__item"></div>
                    <div class="cart__item"></div>
                    <div class="cart__item"></div>
                </div>

                <hr>

                <!-- Coupon -->
                <form class="cart__coupon coupon">
                    <input type="text" name="coupon" class="coupon__input" placeholder="Enter coupon code">
                    <button type="button" class="coupon__btn">Apply Coupon</button>
                </form>

                <!-- Price summary -->
                <dl class="cart__summary summary">
                    <div class="summary__item">
                        <dt>Sub total</dt>
                        <dd>$2597.00</dd>
                    </div>

                    <div class="summary__item summary__spacing">
                        <dt>Tax</dt>
                        <dd>$623.28</dd>
                    </div>

                    <div class="summary__item summary__item--total">
                        <dt>Total</dt>
                        <dd>$3220.28</dd>
                    </div>
                </dl>
            </section>

            <section class="form"></section>
        </main>

        <footer></footer>
    </body>
</html>
